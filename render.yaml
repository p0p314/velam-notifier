services:
  - type: web
    name: velopulse
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false        # URL Supabase PostgreSQL
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_URL
        sync: false        # base https:// pour la page /redirect des notifs
      - key: CRON_SECRET
        sync: false        # protège /cron/* (sync rental_apps, stations, trains)
      - key: TRUST_PROXY
        value: 3           # Cloudflare + Render devant l'app (diagnostic [proxy] du 08/10/2026 : 3 entrées)
      # Module Trains : sources SNCF par défaut (aucune clé requise). Facultatif :
      # TRAINS_ENABLED=0 pour le désactiver, TRAINS_GTFS_URL / TRAINS_RT_* pour un miroir.
