name: Déploiement Render

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le déploiement Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail

          if [ -z "${RENDER_DEPLOY_HOOK:-}" ]; then
            echo "::error::Le secret RENDER_DEPLOY_HOOK doit être défini."
            exit 1
          fi

          http_code=$(curl -sS -w "%{http_code}" -o /dev/null \
            -X POST "${RENDER_DEPLOY_HOOK}")

          echo "HTTP $http_code"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Le deploy hook a retourné HTTP $http_code"
            exit 1
          fi

          echo "Déploiement déclenché avec succès."
