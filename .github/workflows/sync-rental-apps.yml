name: Synchronisation quotidienne (GBFS)

# Synchronisation quotidienne : deep links officiels Vélam (rental_apps),
# référentiel des stations et horaires des trains (GTFS SNCF).
# Toute la planification vit ici — aucun cron côté serveur (Render/backend).
on:
  schedule:
    - cron: "0 2 * * *" # tous les jours à 02:00 UTC
  workflow_dispatch: {}   # déclenchement manuel depuis l'onglet Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Appel de l'endpoint de synchronisation
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${BACKEND_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Les secrets BACKEND_URL et CRON_SECRET doivent être définis."
            exit 1
          fi

          # -f : échoue (exit ≠ 0) sur statut HTTP >= 400 → marque le job en échec.
          http_code=$(curl -sS -f -w "%{http_code}" -o response.json \
            -X POST "${BACKEND_URL%/}/cron/sync-rental-apps" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")

          echo "HTTP $http_code"
          echo "Réponse :"
          cat response.json

      # Référentiel des stations (nouvelles stations, déplacements, suppressions).
      - name: Rechargement du référentiel des stations
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl -sS -f -o response.json \
            -X POST "${BACKEND_URL%/}/cron/refresh-stations" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json"
          cat response.json

      # Horaires des trains (GTFS SNCF) : requête conditionnelle, rien n'est
      # retéléchargé si la SNCF n'a pas publié de nouvelle version.
      - name: Synchronisation des horaires des trains
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl -sS -f -o response.json --max-time 300 \
            -X POST "${BACKEND_URL%/}/cron/sync-trains" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json"
          cat response.json
